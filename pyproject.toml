[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayzoom"
version = "0.3.0"
description = "Cinematic auto-zoom screen recorder for Hyprland (Wayland)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wayzoom = "wayzoom.cli:main"

[tool.setuptools.packages.find]
include = ["wayzoom*"]
